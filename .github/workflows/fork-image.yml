name: Fork image

on:
  pull_request:
    branches: [agentconnect-1.45]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Build verification image from source
        uses: docker/build-push-action@v6
        with:
          context: .
          target: verification
          load: true
          tags: logto-fork:verification
          cache-from: type=gha,scope=logto-fork
          cache-to: type=gha,mode=max,scope=logto-fork
      - name: Verify linked identities and stored tokens
        run: bash .scripts/fork/verify.sh logto-fork:verification

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified source revision
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.45.0-fork
            org.opencontainers.image.licenses=MPL-2.0
          cache-from: type=gha,scope=logto-fork
          cache-to: type=gha,mode=max,scope=logto-fork
